server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Label: nama container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)' 
        target_label: container
      # Label: nama image/service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Label: stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

    pipeline_stages:
      # STAGE 1: Parse JSON (Laravel structured log & Apache JSON log)
      - json:
          expressions:
            level:      'level'       # Laravel: {"level":"ERROR"}
            levelname:  'levelname'   # Python:  {"levelname":"ERROR"}
            http_status: 'status'     # Apache:  {"status":200}
            message:    'message'

      # STAGE 2: Normalisasi level dari Python vs Laravel
      - template:
          source: level
          template: '{{ if .levelname }}{{ .levelname }}{{ else }}{{ .level }}{{ end }}'

      # STAGE 3: Mapping HTTP status code → level
      - template:
          source: level
          template: |
            {{- if eq .Value "" -}}
              {{- if .http_status -}}
                {{- $s := .http_status | int -}}
                {{- if ge $s 500 -}}ERROR
                {{- else if ge $s 400 -}}WARNING
                {{- else if ge $s 300 -}}INFO
                {{- else -}}INFO
                {{- end -}}
              {{- end -}}
            {{- else -}}{{- .Value -}}{{- end -}}

      # STAGE 4: Regex fallback untuk Apache Error Log (format lama)
      - regex:
          expression: '\[(?P<apache_level>notice|warn|error|crit|alert|emerg)\]'

      # STAGE 5: Gunakan apache_level jika level masih kosong
      - template:
          source: level
          template: '{{ if and (eq .Value "") .apache_level }}{{ ToUpper .apache_level }}{{ else }}{{ .Value }}{{ end }}'

      # STAGE 6: Uppercase normalisasi & default INFO
      - template:
          source: level
          template: '{{ if eq (ToUpper .Value) "" }}INFO{{ else }}{{ ToUpper .Value }}{{ end }}'

      # STAGE 7: Set labels
      - labels:
          level:
          container:
          service:
