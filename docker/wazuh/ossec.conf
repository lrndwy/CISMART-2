<ossec_config>
  <global>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <alerts_log>yes</alerts_log>
    <jsonout_output>yes</jsonout_output>
  </global>

  <!-- Server: terima koneksi dari Agent -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>udp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Alert levels yang dicatat -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- INTEGRATION: Forward alert ke Loki -->
  <integration>
    <name>custom-loki</name>
    <hook_url>http://loki:3100/loki/api/v1/push</hook_url>
    <level>7</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- Active Response (opsional: auto-block IP penyerang) -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
  </active-response>

</ossec_config>
