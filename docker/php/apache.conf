<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Error log ke stderr (dibaca Docker sebagai stream terpisah)
    ErrorLog /dev/stderr

    # Access log ke stdout dalam format JSON agar bisa di-parse Promtail
    LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t\",\"ip\":\"%a\",\"method\":\"%m\",\"path\":\"%U%q\",\"protocol\":\"%H\",\"status\":%>s,\"size\":%B,\"referer\":\"%{Referer}i\",\"agent\":\"%{User-Agent}i\"}" json_combined
    CustomLog /dev/stdout json_combined
</VirtualHost>
