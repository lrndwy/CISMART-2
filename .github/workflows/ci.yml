name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    name: Pest (sqlite in-memory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, intl, zip, gd, bcmath, exif, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

  assets:
    name: Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: laravel_app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build